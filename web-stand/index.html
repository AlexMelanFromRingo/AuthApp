<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>Стенд перевірки TOTP/OCRA</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen dark:bg-slate-950 dark:text-slate-100">
  <header class="bg-slate-900 text-white shadow">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between flex-wrap gap-2">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <svg viewBox="0 0 108 108" class="w-7 h-7" aria-hidden="true">
          <path d="M54 20 L81 30 V55 C81 72 69.5 84.5 54 92 C38.5 84.5 27 72 27 55 V30 Z" fill="#fff"/>
          <g fill="#1B5E9E">
            <circle cx="42" cy="52" r="4.2"/><circle cx="54" cy="52" r="4.2"/><circle cx="66" cy="52" r="4.2"/>
            <circle cx="42" cy="66" r="4.2"/><circle cx="54" cy="66" r="4.2"/><circle cx="66" cy="66" r="4.2"/>
          </g>
        </svg>
        Стенд перевірки алгоритмів автентифікації
      </h1>
      <nav class="flex gap-1 items-center" id="nav">
        <button data-page="totp" class="nav-btn">TOTP</button>
        <button data-page="ocra" class="nav-btn">OCRA</button>
        <button data-page="about" class="nav-btn">Довідка</button>
        <button id="theme-toggle" class="nav-btn" type="button"
                title="Перемкнути тему" aria-label="Перемкнути тему">🌙</button>
      </nav>
    </div>
  </header>

  <main id="app" class="max-w-4xl mx-auto px-4 py-6"></main>

  <footer class="max-w-4xl mx-auto px-4 py-6 text-sm text-slate-500 dark:text-slate-400">
    Дипломна робота бакалавра з кібербезпеки. Усі обчислення виконуються
    локально у вашому браузері; секрети нікуди не передаються і зникають
    після перезавантаження сторінки.
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
